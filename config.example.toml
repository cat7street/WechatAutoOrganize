# ---- LLM：任何 OpenAI 兼容端点都能接，改 base_url 即可 ----
[llm]
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
# json_object 兼容面最广；端点支持结构化输出时改 json_schema
response_format = "json_object"
# 该网关会丢弃 system 消息，指令要拼进 user 消息
system_role = "user"
temperature = 0.0
timeout = 180
max_chars_per_request = 12000

# ---- 采集 ----
[collect]
# 留空则自动探测 ~/Documents/xwechat_files/*/db_storage
db_dir = ""
work_dir = "decrypted"
keys_file = "keys.json"
tool_path = "tools/wcdb-key-tool-main/wcdb_key_tool_windows.py"

# ---- 过滤 ----
[filter]
# 会话关键词：wxid / xxxx@chatroom / 备注名 / 群名片段，任一命中即纳入
whitelist = []
# 参与抽取的消息类型（1=文本）
text_types = [1]
# 首次运行回看多少小时
window_hours = 48

# ---- 媒体（非文本消息）----
# 图片会被解出来交给多模态模型看；文件抽正文当文本；语音本机无音频文件，只给时长
[media]
# 非文本消息总开关（图/文件/语音元信息）
enabled = true
images = true
files = true
voice = true
max_file_chars = 4000
# 上游 wechat-decrypt（提供 decode_image.py / find_image_key.py）
image_tool_dir = "tools/wechat-decrypt"

# ---- 产出 ----
[output]
state_db = "data/state.db"
out_dir = "out"

# ---- 面板 ----
[server]
host = "127.0.0.1"
port = 8787
# 启动后自动打开浏览器
open_browser = true
# 指定用哪个浏览器（留空用系统默认），例如：
# browser = "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
browser = ""

[reconcile]
# 回溯核对：把整段时间窗的对话交给模型，让它逐条判断取消/替代/继续
enabled = true
# 看多久的对话
window_hours = 48
# 单次送进去的最大字符数（超了从最早截断，保留最新）
max_context_chars = 160000
# 每次调用带多少条待办
tasks_per_call = 12
# 单次运行最多几次调用
max_calls = 8

[pipeline]
# incremental：只抽水位线之后的新消息（快、便宜）
# full：把最近 window_hours 的完整对话 + 当前待办一起给模型，让它整体更新（定时任务用）
mode = "incremental"

[schedule]
# 内置定时：自动解密 → 全量对账 → 合并去重 → 出当天 Markdown
enabled = false
# 定时任务用哪种模式：full = 48h 全量对账（推荐）/ incremental = 只抽新消息
mode = "full"
interval_minutes = 60
# 每天固定时刻也跑（可多个），与间隔取最近的一次；两个都设就都会生效
daily_times = []
# 定时那轮跳过重新解密（WAL 仍会合并，更快）
skip_decrypt = false
# 启动后立刻跑一轮
run_on_start = true
